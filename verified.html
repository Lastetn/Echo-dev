<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email vérifié - Echo dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, Arial, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0f0f14;
      color: #f5f5f7;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      text-align: center;
      background: #171720;
      border: 1px solid #2c2c3a;
      border-radius: 18px;
    }

    .icon { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; color: #8b5cf6; margin-bottom: 8px; }
    p { color: #a1a1aa; line-height: 1.5; margin-bottom: 24px; }

    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Email vérifié</h1>
    <p>Ton compte Echo dev est activé. Tu peux maintenant te connecter.</p>
    <a href="index.html">Aller sur Echo dev</a>
  </div>
</body>
</html>
